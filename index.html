<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Credenciamento AMUPE</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

body {

  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
  background: #f5f5f5;

}


h2 {

  margin-bottom: 20px;

}


#reader {

  width: 100%;
  max-width: 400px;
  margin: auto;
  background: white;
  padding: 10px;
  border-radius: 10px;

}


#resultado {

  margin-top: 20px;
  padding: 20px;
  background: white;
  border-radius: 10px;
  font-size: 18px;

}


.sucesso {

  color: green;

}


.erro {

  color: red;

}


.aviso {

  color: orange;

}


button {

  margin-top: 20px;
  padding: 12px 20px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;

}


</style>


</head>


<body>


<h2>Credenciamento AMUPE</h2>


<div id="reader"></div>


<div id="resultado">

Aponte a câmera para o QR Code

</div>



<button onclick="novaLeitura()" style="display:none" id="btnNova">

Nova leitura

</button>




<script>


const API = 

"https://script.google.com/macros/s/AKfycbyluiOa5se9-MpMOyaRi-0Ahf2voShFdAdbftTUUAT7Dr98qHZ8-wMeUZKhTMk2MueB7g/exec";



let processando = false;

let scanner;



function sucesso(qrCode){



// Impede múltiplas leituras

if(processando){

  return;

}


processando = true;



document.getElementById("resultado").innerHTML =
"⏳ Consultando participante...";



let id = qrCode;



// Extrai somente o ID do QR

if(qrCode.includes("?id=")){

  id = qrCode.split("?id=")[1];

}




fetch(
  API + "?id=" + encodeURIComponent(id)
)



.then(response => response.json())



.then(data => {



if(data.status){



document.getElementById("resultado").innerHTML =


`

<div class="sucesso">

<h2>✅ ${data.titulo}</h2>


<p>
<strong>Nome:</strong><br>
${data.nome}
</p>


<p>
<strong>Município:</strong><br>
${data.municipio}
</p>


<p>
<strong>Horário:</strong><br>
${new Date(data.horario)
.toLocaleString("pt-BR")}
</p>


</div>

`;



}

else {



document.getElementById("resultado").innerHTML =


`

<div class="aviso">

<h2>⚠️ ${data.titulo}</h2>


<p>
${data.nome || ""}
</p>


<p>
${data.mensagem || ""}
</p>


</div>

`;



}



pararScanner();



document.getElementById("btnNova").style.display = "inline-block";



})


.catch(error => {



document.getElementById("resultado").innerHTML =


`

<div class="erro">

<h2>❌ Erro</h2>

Erro de comunicação com o servidor.

</div>

`;



processando = false;



});



}




function erroLeitura(error){

// Ignora erros durante procura do QR

}




function pararScanner(){


if(scanner){


scanner.clear();

}


}




function novaLeitura(){


processando = false;


document.getElementById("resultado").innerHTML =

"Aponte a câmera para o QR Code";


document.getElementById("btnNova").style.display =
"none";



iniciarScanner();


}




function iniciarScanner(){



scanner = new Html5QrcodeScanner(

"reader",

{

fps:10,

qrbox:250

}

);



scanner.render(

sucesso,

erroLeitura

);



}



iniciarScanner();



</script>


</body>

</html>
