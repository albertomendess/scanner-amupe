<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Credenciamento AMUPE</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

#reader {
  width: 100%;
  max-width: 400px;
  margin: auto;
}

#resultado {

margin-top:20px;
font-size:18px;

}

</style>

</head>


<body>


<h2>Credenciamento AMUPE</h2>

<div id="reader"></div>

<div id="resultado">
Aponte a câmera para o QR Code
</div>



<script>


const API = 
"https://script.google.com/macros/s/AKfycbyluiOa5se9-MpMOyaRi-0Ahf2voShFdAdbftTUUAT7Dr98qHZ8-wMeUZKhTMk2MueB7g/exec";



function sucesso(qrCode){


document.getElementById("resultado").innerHTML =
"Consultando participante...";


fetch(API + "?id=" + encodeURIComponent(qrCode))

.then(response => response.json())

.then(data => {


if(data.status){


document.getElementById("resultado").innerHTML =
`
<h3>✅ ${data.titulo}</h3>

Nome: ${data.nome}<br>

Município: ${data.municipio}<br>

Horário: ${new Date(data.horario).toLocaleString()}

`;

}

else{


document.getElementById("resultado").innerHTML =
`
<h3>⚠️ ${data.titulo}</h3>

${data.nome || ""}
<br>
${data.mensagem || ""}

`;

}


})


.catch(error=>{


document.getElementById("resultado").innerHTML =
"Erro de comunicação";


});


}



const scanner = new Html5QrcodeScanner(

"reader",

{

fps:10,

qrbox:250

}

);



scanner.render(

sucesso,

error => {

}

);


</script>


</body>

</html>
