```html
<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Credenciamento AMUPE</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 20px;
}

#reader {

  width: 100%;
  max-width: 400px;
  margin: auto;
  background: white;
  padding: 10px;
  border-radius: 10px;

}

#resultado {

  margin-top: 20px;
  font-size: 18px;
  background: white;
  padding: 15px;
  border-radius: 10px;

}

</style>

</head>


<body>


<h2>Credenciamento AMUPE</h2>


<div id="reader"></div>


<div id="resultado">
Aponte a câmera para o QR Code
</div>



<script>


const API = 
"https://script.google.com/macros/s/AKfycbyluiOa5se9-MpMOyaRi-0Ahf2voShFdAdbftTUUAT7Dr98qHZ8-wMeUZKhTMk2MueB7g/exec";



function sucesso(qrCode){


document.getElementById("resultado").innerHTML =
"Consultando participante...";


// Extrai somente o ID do participante
let id = qrCode;


if(qrCode.includes("?id=")){

  id = qrCode.split("?id=")[1];

}


// Envia para o Apps Script

fetch(
  API + "?id=" + encodeURIComponent(id)
)

.then(response => response.json())


.then(data => {


if(data.status){


document.getElementById("resultado").innerHTML =

`
<h3>✅ ${data.titulo}</h3>

<strong>Nome:</strong> ${data.nome}<br>

<strong>Município:</strong> ${data.municipio}<br>

<strong>Horário:</strong> ${new Date(data.horario).toLocaleString("pt-BR")}

`;



}

else{


document.getElementById("resultado").innerHTML =

`
<h3>⚠️ ${data.titulo}</h3>

${data.nome ? "<strong>Nome:</strong> " + data.nome + "<br>" : ""}

${data.mensagem || ""}

`;

}


})


.catch(error => {


document.getElementById("resultado").innerHTML =

"❌ Erro de comunicação com o servidor";


});


}



function erroLeitura(error){

// Ignora erros normais durante a busca do QR

}



const scanner = new Html5QrcodeScanner(

"reader",

{

fps: 10,

qrbox: {

width: 250,

height: 250

}

}

);



scanner.render(

sucesso,

erroLeitura

);



</script>


</body>

</html>
```
