<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1a73e8" />
  <title>Credenciamento AMUPE</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #1a73e8;
      --success: #166534;
      --success-bg: #dcfce7;
      --error: #991b1b;
      --error-bg: #fee2e2;
      --warning: #92400e;
      --warning-bg: #fef3c7;
      --info: #1d4ed8;
      --info-bg: #dbeafe;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      margin: 8px 0 4px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    #status {
      padding: 14px 18px;
      border-radius: var(--radius);
      margin: 0 auto 16px;
      max-width: 420px;
      font-size: 1.05rem;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }

    .aguardando { background: var(--info-bg); color: var(--info); }
    .processando { background: var(--warning-bg); color: var(--warning); }
    .sucesso { background: var(--success-bg); color: var(--success); }
    .erro { background: var(--error-bg); color: var(--error); }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 0 auto 12px;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
    }

    #reader video {
      border-radius: var(--radius) !important;
      object-fit: cover;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      max-width: 420px;
      margin: 16px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: left;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      text-align: center;
    }

    .card p {
      margin: 0 0 12px;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    #codigoManual {
      width: 100%;
      padding: 14px;
      font-size: 1.35rem;
      text-align: center;
      border-radius: 10px;
      border: 1.5px solid #d1d5db;
      outline: none;
      letter-spacing: 2px;
      font-weight: 600;
    }

    #codigoManual:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 22px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      width: 100%;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: var(--text);
      margin-top: 10px;
    }

    #resultado {
      max-width: 420px;
      margin: 16px auto 0;
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: left;
      display: none;
    }

    #resultado.visible { display: block; }

    #resultado h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
      text-align: center;
    }

    #resultado .linha {
      margin: 8px 0;
      font-size: 0.95rem;
    }

    #resultado .linha b {
      color: var(--muted);
      font-weight: 600;
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    #novo {
      display: none;
      max-width: 420px;
      margin: 12px auto 0;
    }

    #novo.visible { display: block; }

    .footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <h1>📋 Credenciamento AMUPE</h1>
  <p class="subtitle">Aproxime o QR Code da câmera</p>

  <div id="status" class="aguardando">🔵 Aguardando QR Code</div>

  <div id="reader"></div>

  <div class="card">
    <h3>Não possui o QR Code?</h3>
    <p>Digite apenas os <b>números finais</b> da inscrição<br>
      <small>Exemplo: para <b>AMUPE-JSS-0004</b> digite <b>4</b> ou <b>0004</b></small>
    </p>
    <input
      id="codigoManual"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      autocomplete="off"
      maxlength="6"
      placeholder="4"
      onkeydown="if(event.key==='Enter')confirmarManual()"
    />
    <button class="btn btn-primary" id="btnManual" onclick="confirmarManual()">
      Confirmar Presença
    </button>
  </div>

  <div id="resultado"></div>

  <button id="novo" class="btn btn-secondary" onclick="novaLeitura()">
    🔄 Nova leitura
  </button>

  <p class="footer">AMUPE · Sistema de Credenciamento</p>

  <script>
    // ============================================================
    // CONFIGURAÇÃO – esta URL será injetada pela Streamlit (Sessão 3)
    // ============================================================
    const API = "https://script.google.com/macros/s/AKfycbwFoBHeju5TzLtupA1RSvJwU-quReg-ZbM2p1GA8lnyjBT_ORjZ2Wq5CYpcM2kicCp3/exec";

    let processando = false;
    let html5QrCode = null;

    function alterarStatus(texto, classe) {
      const el = document.getElementById("status");
      el.innerHTML = texto;
      el.className = classe;
    }

    function mostrarResultado(html) {
      const el = document.getElementById("resultado");
      el.innerHTML = html;
      el.classList.add("visible");
    }

    function esconderResultado() {
      const el = document.getElementById("resultado");
      el.innerHTML = "";
      el.classList.remove("visible");
    }

    function onScanSuccess(decodedText) {
      if (processando) return;
      processando = true;

      alterarStatus("🟡 Consultando participante...", "processando");
      pararScanner();

      let id = decodedText;

      // Extrai ?id= se for uma URL
      if (decodedText.includes("?id=")) {
        try {
          const url = new URL(decodedText);
          id = url.searchParams.get("id") || decodedText.split("?id=")[1].split("&")[0];
        } catch (e) {
          id = decodedText.split("?id=")[1].split("&")[0];
        }
      }

      registrarCodigo(decodeURIComponent(id));
    }

    function registrarCodigo(id) {
      document.getElementById("btnManual").disabled = true;

      fetch(API + "?id=" + encodeURIComponent(id))
        .then(r => r.json())
        .then(data => {
          if (data.status) {
            somSucesso();
            alterarStatus("🟢 Presença confirmada", "sucesso");
          } else {
            alterarStatus("🔴 " + (data.titulo || "Não foi possível confirmar"), "erro");
          }

          const grupoHtml = data.grupo
            ? `<div class="linha"><b>Grupo</b>${data.grupo}</div>`
            : "";

          mostrarResultado(`
            <h2>${data.titulo || ""}</h2>
            <div class="linha"><b>Nome</b>${data.nome || "—"}</div>
            <div class="linha"><b>Município</b>${data.municipio || "—"}</div>
            <div class="linha"><b>Horário</b>${data.horario || "—"}</div>
            ${grupoHtml}
          `);

          document.getElementById("novo").classList.add("visible");
        })
        .catch(() => {
          alterarStatus("🔴 Erro de comunicação com o servidor", "erro");
          processando = false;
          document.getElementById("btnManual").disabled = false;
        });
    }

    function pararScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => {
          html5QrCode = null;
        });
      }
    }

    function novaLeitura() {
      esconderResultado();
      document.getElementById("novo").classList.remove("visible");
      document.getElementById("btnManual").disabled = false;
      document.getElementById("codigoManual").value = "";
      processando = false;
      alterarStatus("🔵 Aguardando QR Code", "aguardando");
      iniciarScanner();
    }

    function somSucesso() {
      try {
        const audio = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
        audio.volume = 0.7;
        audio.play().catch(() => {});
      } catch (e) {}
    }

    function iniciarScanner() {
      if (html5QrCode) return;

      const readerEl = document.getElementById("reader");
      readerEl.innerHTML = "";

      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 20,                    // mais frames = detecção mais rápida
        qrbox: function(w, h) {
          const size = Math.floor(Math.min(w, h) * 0.75);
          return { width: size, height: size };
        },
        aspectRatio: 1.0,
        disableFlip: false,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true  // usa API nativa quando disponível (bem mais rápida)
        }
      };

      // Preferência: câmera traseira, resolução moderada (melhor desempenho)
      const cameraConfig = {
        facingMode: "environment"
      };

      html5QrCode.start(cameraConfig, config, onScanSuccess, () => {})
        .catch(err => {
          // Fallback: tenta qualquer câmera
          Html5Qrcode.getCameras().then(cameras => {
            if (cameras && cameras.length) {
              html5QrCode.start(cameras[0].id, config, onScanSuccess, () => {})
                .catch(() => {
                  alterarStatus("🔴 Não foi possível acessar a câmera", "erro");
                });
            } else {
              alterarStatus("🔴 Nenhuma câmera encontrada", "erro");
            }
          }).catch(() => {
            alterarStatus("🔴 Erro ao iniciar a câmera", "erro");
          });
        });
    }

    function confirmarManual() {
      let valor = document.getElementById("codigoManual").value.trim();

      if (!valor) {
        alert("Informe o número da inscrição.");
        return;
      }

      // Aceita só dígitos: 4 → 0004 | 12 → 0012 | 0004 → 0004
      if (/^\d+$/.test(valor)) {
        const numero = valor.replace(/^0+/, "") || "0";  // remove zeros à esquerda, mantém "0"
        // Envia como "num:0004" para o backend reconhecer busca por sufixo
        const padded = numero.padStart(4, "0");
        registrarCodigo("num:" + padded);
        return;
      }

      // Se colou o código completo
      valor = valor.toUpperCase().replace(/\s+/g, "");
      registrarCodigo(valor);
    }

    // Inicia o scanner
    iniciarScanner();
  </script>
</body>
</html>
