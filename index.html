<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Credenciamento AMUPE</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

body {

  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 15px;
  background: #f2f2f2;

}


h1 {

  font-size: 24px;

}


#status {

  padding: 15px;
  border-radius: 10px;
  margin: 15px auto;
  max-width: 400px;
  font-size: 20px;
  font-weight: bold;

}


.aguardando {

  background: #dbeafe;
  color: #1d4ed8;

}


.processando {

  background: #fef3c7;
  color: #92400e;

}


.sucesso {

  background: #dcfce7;
  color: #166534;

}


.erro {

  background: #fee2e2;
  color: #991b1b;

}



#reader {

  width: 100%;
  max-width: 450px;
  margin:auto;

}



#resultado {

  margin-top:15px;
  background:white;
  border-radius:10px;
  padding:15px;
  font-size:18px;

}



button {

  margin-top:20px;
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;

}


</style>


</head>


<body>


<h1>📋 Credenciamento AMUPE</h1>


<div id="status" class="aguardando">

🔵 Aguardando QR Code

</div>


<div id="reader"></div>


<div id="resultado"></div>


<button id="novo"
onclick="novaLeitura()"
style="display:none">

Nova leitura

</button>



<script>


const API =

"https://script.google.com/macros/s/AKfycbyluiOa5se9-MpMOyaRi-0Ahf2voShFdAdbftTUUAT7Dr98qHZ8-wMeUZKhTMk2MueB7g/exec";



let processando = false;

let scanner;



function alterarStatus(texto, classe){


const status =
document.getElementById("status");


status.innerHTML = texto;

status.className = classe;


}




function sucesso(qrCode){



if(processando){

return;

}



processando=true;



alterarStatus(

"🟡 Consultando participante...",

"processando"

);



let id = qrCode;



if(qrCode.includes("?id=")){


id = qrCode.split("?id=")[1];


}



fetch(

API + "?id=" + encodeURIComponent(id)

)



.then(response => response.json())



.then(data => {



if(data.status){


somSucesso();


alterarStatus(

"🟢 Presença confirmada",

"sucesso"

);



document.getElementById("resultado").innerHTML =

`

<h2>✅ ${data.titulo}</h2>

<p>
<b>Nome:</b><br>
${data.nome}
</p>

<p>
<b>Município:</b><br>
${data.municipio}
</p>

<p>
<b>Horário:</b><br>
${new Date(data.horario)
.toLocaleString("pt-BR")}
</p>

`;



}

else{


alterarStatus(

"🔴 Usuário já processado",

"erro"

);



document.getElementById("resultado").innerHTML =

`

<h2>⚠️ ${data.titulo}</h2>

<p>
${data.nome || ""}
</p>

`;



}



pararScanner();


document.getElementById("novo")
.style.display="inline-block";



})



.catch(()=>{


alterarStatus(

"🔴 Erro de comunicação",

"erro"

);



processando=false;


});



}





function pararScanner(){


if(scanner){


scanner.clear();


}


}




function novaLeitura(){



document.getElementById("resultado").innerHTML="";


document.getElementById("novo")
.style.display="none";


processando=false;



alterarStatus(

"🔵 Aguardando QR Code",

"aguardando"

);



iniciarScanner();


}




function somSucesso(){


const audio =
new Audio(

"https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"

);


audio.play();


}




function iniciarScanner(){



scanner = new Html5QrcodeScanner(

"reader",

{

fps:10,

qrbox:250,

rememberLastUsedCamera:true

}

);



scanner.render(

sucesso,

()=>{}

);


}



iniciarScanner();



</script>


</body>

</html>
```
